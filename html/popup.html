<!DOCTYPE html>
<html>

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>__MSG_popup_title__</title>
   <link rel="stylesheet" href="/css/libs/normalize.min.css">

   <link rel="stylesheet" href="/css/libs/tooltip/tooltip.min.css">
   <link rel="stylesheet" href="/css/libs/tooltip/tooltip-animation.min.css">

   <link rel="stylesheet" href="/css/libs/switch_checkbox.css">

   <!-- <link rel="stylesheet" href="/css/-theme.css">
   <link rel="stylesheet" href="/css/-global.css">
   <link rel="stylesheet" href="/css/-popup.css"> -->
   <link rel="stylesheet" href="/css/style.css">

   <script type="module" src="/js/theme-applier.js"></script>
</head>

<body class="page-popup">
   <div class="popup-container" role="main">
      <!-- Header: Contains title, global actions, and pause toggle -->
      <header class="popup-header">
         <!-- Main header row with title and action icons -->
         <div class="header-main">
            <h1 class="popup-title">__MSG_popup_title__</h1>
            <div class="header-actions">
               <div class="pause-wrapper" tooltip="__MSG_popup_btn_pause_all__" flow="down">
                  <input type="checkbox" id="pause-switch" class="switch-checkbox">
               </div>
               <button id="new-script-btn" class="btn-icon" tooltip="__MSG_tooltip_new_script__" flow="down"
                  aria-label="__MSG_tooltip_new_script__">
                  <svg width="20" height="20" aria-hidden="true">
                     <use xlink:href="#iconAdd"></use>
                  </svg>
               </button>
               <button id="open-options-btn" class="btn-icon" tooltip="__MSG_popup_btn_open_options__" flow="left"
                  aria-label="__MSG_popup_btn_open_options__">
                  <svg width="20" height="20" aria-hidden="true">
                     <use xlink:href="#iconOption"></use>
                  </svg>
               </button>
            </div>
         </div>

         <!-- Info banner shown when a page reload is required -->
         <div id="refresh-prompt" class="info-banner hide" role="status">
            <span>__MSG_popup_reload_prompt__</span>
            <button id="reload-tab-btn" class="btn-secondary btn-compact">__MSG_popup_reload_btn__</button>
         </div>
      </header>

      <!-- Script list -->
      <main>
         <ul id="script-list"></ul>
      </main>

      <!-- Footer: Contains a link to find more scripts for the current site -->
      <footer class="popup-footer">
         <div id="find-scripts-container" class="find-scripts-container hide"></div>
      </footer>
   </div>

   <!-- Log Viewer Modal: A hidden modal for displaying script console logs -->
   <div id="logs-modal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="logs-modal-title">
      <div class="modal-content">
         <div class="modal-header">
            <h2 id="logs-modal-title">__MSG_popup_logs_title__</h2>
            <button id="close-logs-modal" class="close-btn" tooltip="__MSG_popup_close_modal_tooltip__"
               flow="left">&times;</button>
         </div>
         <div class="modal-body">
            <div id="logs-content" class="logs-container" role="log"></div>
         </div>
         <div class="modal-footer">
            <button id="copy-logs" class="btn">__MSG_popup_btn_copy_logs__</button>
            <button id="clear-logs" class="btn btn-danger">__MSG_popup_btn_clear_logs__</button>
            <button id="mute-logs-btn" class="btn" style="display: none;"></button>
         </div>
      </div>
   </div>

   <!-- SVG Icon Definitions: A hidden container for all SVG icons used in the UI -->
   <svg style="display: none;">
      <symbol id="iconAdd" viewBox="0 0 24 24">
         <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
      </symbol>
      <symbol id="iconConsole" viewBox="0 0 24 24">
         <path
            d="M20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4M9.5 16.5L8 15L9.5 13.5L11 15L9.5 16.5M16 11.5H8V9.5H16V11.5M16 8.5H8V6.5H16V8.5Z" />
      </symbol>
      <symbol id="iconEdit" viewBox="0 0 24 24">
         <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
      </symbol>
      <symbol id="iconRemove" viewBox="0 0 24 24">
         <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
      </symbol>
      <symbol id="iconOption" viewBox="0 0 24 24">
         <path
            d="M13.875 22h-3.75q-.375 0-.65-.25t-.325-.625l-.3-2.325q-.325-.125-.612-.3q-.288-.175-.563-.375l-2.175.9q-.35.125-.7.025t-.55-.425L2.4 15.4q-.2-.325-.125-.7q.075-.375.375-.6l1.875-1.425Q4.5 12.5 4.5 12.337v-.675q0-.162.025-.337L2.65 9.9q-.3-.225-.375-.6q-.075-.375.125-.7l1.85-3.225q.175-.35.537-.438q.363-.087.713.038l2.175.9q.275-.2.575-.375q.3-.175-.6-.3l.3-2.325q.05-.375.325-.625t.65-.25h3.75q.375 0 .65.25t.325.625l.3 2.325q.325.125.613.3q.287.175.562.375l2.175-.9q.35-.125.7-.025t.55.425L21.6 8.6q.2.325.125.7q-.075.375-.375.6l-1.875 1.425q.025.175.025.337v.675q0 .163-.05.338l1.875 1.425q.3.225.375.6q.075.375-.125.7l-1.85 3.2q-.2.325-.562.438q-.363.112-.713-.013l-2.125-.9q-.275.2-.575.375q-.3.175-.6.3l-.3 2.325q-.05.375-.325-.625t-.65.25Zm-1.825-6.5q1.45 0 2.475-1.025Q15.55 13.45 15.55 12q0-1.45-1.025-2.475Q13.5 8.5 12.05 8.5q-1.475 0-2.488 1.025Q8.55 10.55 8.55 12q0 1.45 1.012 2.475Q10.575 15.5 12.05 15.5Z">
         </path>
      </symbol>
      <symbol id="iconSearch" viewBox="0 0 24 24" fill="currentColor">
         <path
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14z" />
      </symbol>
      <symbol id="iconLink" viewBox="0 0 24 24">
         <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
      </symbol>
      <symbol id="iconBlock" viewBox="0 0 24 24">
         <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm5.31-3.1L6.1 5.69C7.45 4.63 9.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/>
      </symbol>
   </svg>

   <script type="module" src="/js/pages/popup.js"></script>
</body>

</html>
